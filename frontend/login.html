<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f7fc">
    <title>Вход — MyBuilding</title>
    <link rel="preload" href="assets/fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="fonts.css?v=17">
    <link rel="stylesheet" href="theme.css?v=17">
    <link rel="stylesheet" href="components.css?v=17">
    <link rel="stylesheet" href="auth.css?v=17">
</head>

<body class="auth-body">
    <main class="auth-card">
        <div class="auth-brand">
            <img src="assets/design_key.png" alt="" class="auth-logo">
            <div>
                <h1 class="auth-title">MyBuilding</h1>
                <p class="auth-subtitle">Учёт бюджета строительных объектов</p>
            </div>
        </div>

        <div id="auth-error" class="auth-error" hidden></div>

        <form id="login-form" class="form" novalidate>
            <div class="form-row">
                <label class="label" for="login">Почта или телефон</label>
                <input class="field" type="text" id="login" name="login" autocomplete="username"
                    inputmode="email" required>
            </div>

            <div class="form-row">
                <label class="label" for="password">Пароль</label>
                <div class="auth-password">
                    <input class="field" type="password" id="password" name="password"
                        autocomplete="current-password" required>
                    <button type="button" class="auth-eye" id="toggle-password" aria-label="Показать пароль">
                        <svg class="icon icon--sm" viewBox="0 0 24 24">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn--primary btn--lg btn--block" id="login-submit">
                Войти
            </button>
        </form>

        <!-- Кнопка появляется только если Google OAuth настроен на сервере -->
        <div id="google-block" hidden>
            <div class="auth-divider"><span>или</span></div>
            <a class="btn btn--secondary btn--lg btn--block" href="/api/auth/google">
                <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#4285F4"
                        d="M45.1 24.5c0-1.6-.1-2.8-.4-4H24v7.3h12.1c-.2 2-1.6 5-4.5 7l-.1.3 6.5 5 .5.1c4.1-3.8 6.6-9.4 6.6-15.7Z" />
                    <path fill="#34A853"
                        d="M24 46c5.9 0 10.9-2 14.5-5.3l-6.9-5.4c-1.9 1.3-4.4 2.2-7.6 2.2-5.8 0-10.7-3.8-12.5-9.800l-.3.1-6.7 5.2-.1.3C7.9 40.9 15.3 46 24 46Z" />
                    <path fill="#FBBC05"
                        d="M11.5 27.7c-.5-1.4-.7-2.9-.7-4.5s.3-3.1.7-4.5v-.3l-6.8-5.3-.2.1C2.9 16.4 2 20.1 2 24s.9 7.6 2.5 10.8l7-7.1Z" />
                    <path fill="#EA4335"
                        d="M24 9.8c4.1 0 6.9 1.8 8.5 3.3l6.2-6C34.9 3.7 29.9 1.5 24 1.5 15.3 1.5 7.9 6.6 4.5 13.2l7 5.4C13.3 12.6 18.2 9.8 24 9.8Z" />
                </svg>
                Войти через Google
            </a>
        </div>
    </main>

    <script src="login.js?v=17"></script>
</body>

</html>
