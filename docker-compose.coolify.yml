# Coolify entrypoint (repo-root contexts). Manual bootstrap still uses deploy/selfhost/.
#
# С 2026-10-11 здесь только база. Сам сайт — отдельное приложение Coolify
# «maruf-web» (Dockerfile, плавная замена без простоя, HEALTHCHECK /health);
# снаружи к нему ведёт nginx из ~/tunnel на сервере (:3011 → maruf-web:8000).
# База видна сайту в общей сети coolify как maruf-db; загрузки — том
# maruf_maruf_uploads. Автовыкладка у этого стека выключена (перезапускает базу).
name: maruf

services:
  db:
    image: postgres:18
    restart: unless-stopped
    networks:
      default: {}
      coolify:
        aliases: [maruf-db]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: maruf
    volumes:
      - maruf_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maruf"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

networks:
  coolify:
    external: true

volumes:
  maruf_pg:
    name: maruf_maruf_pg
    external: true
